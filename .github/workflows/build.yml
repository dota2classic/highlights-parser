name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      # 3. Build JAR and run tests
      - name: Build Spring Boot JAR and run tests
        run: ./gradlew clean bootJar test --no-daemon

      # 4. Set short SHA
      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      # 5. Login to docke hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 6. Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.7.0
        with:
          push: true
          tags: |
            dota2classic/highlights:k8s-${{ env.SHORT_SHA }}
            dota2classic/highlights:k8s-latest
